<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sortreio de números primos</h1>

     <label for ="num1">Numero 1</label>
    <input type="number" id="inicio">
      <label for ="num2">Numero 2</label>
    <input type="number" id="fim">

   

    <div id="resultado"></div>
    <button id="btn">SORTEAR</button>

      <script>
       let inicio = document.querySelector("#inicio")
       let fim = document.querySelector("#fim")
       let resultado = document.querySelector("#resultado")
       let button =document.querySelector("#btn");

        function primo(n){

        if(n < 2){
            return false
        }

        for(let i = 2; i < n; i++){

            if(n % i == 0){
                return false
            }

        }

        return true
    }

       button.addEventListener("click", ()=>{

       

        let vmin = Number(inicio.value)
        let vmax = Number(fim.value)
        let r= Math.floor(Math.random()*(vmax-vmin)+vmin)

        while(!primo(r)){
        r = Math.floor(Math.random() * (vmax - vmin) + vmin)
}


        console.log(r)
        
        let p = document.createElement("p")
        p.innerHTML=r
        p.style.display ="inline-block"
        p.style.border ="1px solid black"
        p.style.borderRadius ="50%"
        p.style.padding = "10px"
        p.style.gap ="1px"
        resultado.appendChild(p)
    })

    </script>
</body>
</html>
