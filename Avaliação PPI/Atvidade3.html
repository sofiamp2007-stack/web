<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        

        .container{
            display: flex;
            align-items: center;
            height: 100vh;
            justify-content: space-around;
        }

        .franca{
            display:flex;
            flex-direction: row;
            align-content: center;
            border: 2px solid black;
            height: 200px;
            width: 300px;
        }

        #box1{
            background-color: blue;
            justify-content: start;
            width:100px;
            height: 200px;
        }

         #box2{
            background-color: white;
            justify-content: center;
            width:100px;
            height: 200px;
        }

         #box3{
            background-color: red;
            justify-content: end;
            width:100px;
            height: 200px;
        }


            .alemanha{
            display:flex;
            flex-direction: column;
            justify-content: flex-start;
            border: 2px solid black;
            height: 200px;
            width: 300px;
        }

          #box4{
            background-color: black;
            justify-content: start;
            width:300px;
            height: 66px;
        }
         #box5{
           background-color: red;
            justify-content: center;
            width:300px;
            height: 66px;
        }
         #box6{
            background-color: yellow;
            justify-content: end;
            width:300px;
            height: 66px;
        }

        .japao{
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            height: 200px;
            width: 300px;
        }

        #box7{
            background-color: red;
            border-radius: 50%;
            height: 80px;
            width:80px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div  class="franca" >
            <div id="box1" class="box"> </div>
            <div id="box2" class="box"> </div>
            <div id="box3" class="box"> </div>
        </div>

         <div  class="alemanha" >
            <div id="box4" class="box"> </div>
            <div id="box5" class="box"> </div>
            <div id="box6" class="box"> </div>
        </div>


         <div  class="japao" >
            <div id="box7" class="box"> </div>
    
           
        </div>
        
    </div>
    
</body>
</html>
