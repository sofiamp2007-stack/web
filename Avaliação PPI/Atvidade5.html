<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

         .container{
            display:grid;
            
            grid-template-rows: 100px 200px 100px;
            grid-template-columns: 200px 100px 100px;
            grid-template-areas: "1 1 1"
                                 "1 2 3"
                                "3 3 3";

        }
        
        #box1{ grid-area: 1;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: orange;
            border-radius: 5%;
              }
        
        #box2{ grid-area: 2;
            display:flex;
            align-items: center;
            justify-content: center;
             background-color: lightblue;
             border-radius: 5%;}

        
        #box3{ grid-area: 3;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: red;
            border-radius: 5%;
        }

        #box4{ grid-area: 4;
            display:flex;
            align-items: center;
            justify-content: center;
             background-color: white;
             border-radius: 5%;
            }
             

        #box5{ grid-area: 5;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: green;
            border-radius: 5%;
       }

       #box6{ grid-area: 6;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: green;
            border-radius: 5%;
       }
       #box7{ grid-area: 7;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: green;
            border-radius: 5%;
       }


    </style>
</head>
<body>
    <div class="container">
            <div id="box1" class="box"> 1</div>
            <div id="box2" class="box"> 2</div>
            <div id="box3" class="box"> 3</div>
            <div id="box4" class="box"> 4</div>
            <div id="box5" class="box"> 5</div>
            <div id="box6" class="box"> 6</div>
            <div id="box7" class="box"> 7</div>
    </div>

</body>
</html>
