<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .container{display:flex;
        height: 100vh;
        justify-content:space-around;/*controla a exibição no eixo flex*/
        flex-direction:row;
        align-items: center; /*eixo perpendicular ao flex-direction*/}
    
        .box{
      
            width: 80px;
            height: 300px;
            overflow: hidden;
            flex-grow: 1;
            border-radius: 40px;
            margin:10px
        }

        .box:hover{
            flex-grow: 100;
            transition: all 5s;
        }
        img{
            width: 300px;
            
        }
        #img1{ 
            background-image:url("./montanha.jpg");
            background-size: cover;
        }
        #img2{
              background-image:url("./inverno.jpg");
            background-size: cover;
        }
         #img3{
              background-image:url("./outono4.jpg");
            background-size: cover;
        }
         #img4{
              background-image:url("./Primavera.jpg");
            background-size: cover;
        }
        #img5{
              background-image:url("./Verão.jpg");
            background-size: cover;
        }

    </style>

</head>
<body>
    <div class="container">
        <div  class="box"  id=img1 > </div >
        <div  class="box" id="img2" ></div >
        <div  class="box" id="img3" ></div >
        <div  class="box" id="img4"></div >
         <div class="box" id="img5"></div>
    </div>
    
</body>
</html>
