<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href= "style.css"> 

    <style>
        #titulo{color:pink;}
        #top{  border:3px solid black;
            box-shadow: 10px 2px gray;
            display: inline-block;
            border-radius: 30 px;
            padding: 20px;
            }
    </style>
</head>
<body>

    <h1 id="titulo">Formulário de Contato</h1>
    <p> Preencha com os dados necessários</p>
    <p><a href="4_curriculo.html">Voltar para o curriculo</a> </p>

    <form>
        <div id="top">

         <label for="nome">Nome:</label><br>
         <input type="text" id="nome" name="nome"
          placeholder="Digite seu nome" required> <br><br>

         <label for="email">E-mail</label><br>
         <input type="email" id="email" email="email"
         placeholder="Digite o e-mail" required> <br><br>

         <label for="assunto">Assunto</label><br>
         <input type="assunto" id="assunto" assunto="assunto"
         placeholder="Digite o assunto" > <br><br>

         <label for="estado">Estado:</label><br>
    <select id="estado" required>
        <option value="">Selecione</option>
        <option value  ="SC">Santa Catarina</option>
        <option value = "PR">Paraná</option>
        <option value = "RS">Rio Grande do Sul</option>
    </select><br><br>

      <label for="mensagem">Menssagem</label><br>
         <input type="mensagem" id="mensagem" mensagem="mensagem"
         placeholder="Digite a mensagem" > <br><br>

         <button type="Submit">Enviar</button>

          </div>
    </form>
   
      
    
</body>
</html>
