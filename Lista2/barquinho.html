<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   
      body{min-height:100vh;  margin: 0;}

    #fundo{   width: 100vw;
    height: 100vh;

    background-image: url("ceu.jpg");
    background-size: cover;
    background-position: center;
    

    position: relative;}

    #barquinho{   
         width: 120px;
        height: 120px;

    background-image: url("barco.png"); 
    background-size: contain;
    position: absolute;
    background-repeat: no-repeat;
    bottom: 50px;

     animation: navegar 10s infinite linear;

    }

     @keyframes navegar{
                    0%{
                        left: -150px;
     
                        
                    }
                    100%{
                        
                        left:1000px;
                    }
                }

    #mar{
          position: absolute;
    bottom: 0;
    width: 100%;
    height: 77px;
    background: lightblue;

    }

    #mar::before,
    #mar::after {
    content: "";
    position: absolute;
    width: 200%;
    height: 100%;
    top: -20px;

    background: radial-gradient(circle, rgba(255,255,255,0.4) 20%, transparent 20%);
    background-size: 50px 50px;

    animation: onda 6s linear infinite;
}

#mar::after {
    top: -10px;
    animation-duration: 10s;
}

@keyframes onda {
    0% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(-50%);
    }
}

#nuvem{
     width: 120px;
    height: 60px;
    background: white;

    border-radius: 50px;
    position: absolute;
    top: 300px;
    left: 70px;


    animation: nuvem 10s linear infinite;
}

   @keyframes nuvem{
                    0%{
                        left: -150px;
     
                        
                    }
                    100%{
                        
                        left:100%;
                    }
                }

    

</style>
<body>
    <div id="fundo" class="box"></div>
    <div id="barquinho" class="box"></div>
    <div id="mar" class="box"></div>
    <div id="nuvem" class="box"></div>
     
    
</body>
</html>
