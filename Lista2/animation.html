<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width:24vw;
            border-radius: 50%;
            animation: rodar 1s linear 0s infinite;
        }
        @keyframes rodar{
          0%{ 
                transform:rotate(0deg);
            }

            100%{
                 transform:rotate(360deg); }
            }
        #coracao{
            display:inline-block;
            font-size: 100px;
            animation: voar 1s linear 0s infinite;
        }

        @keyframes voar{
            0%{ font-size:1px;
                transform:rotate(0deg);
            }

            100%{font-size: 100px;
                 transform:rotate(360deg); }
        }
        #rocket{
            position:fixed;
            bottom:0px;
            font-size: 100px;
            left:0px;
            transform: rotate(-45deg);
            animation: lancamento 10s ease-in infinite;
           
        }
        @keyframes lancamento{
                0%{}

                40%{transform: rotate(0deg)}

                50%{left:50vw;
                    transform:rotate(-60)}
                100%{transform:rotate(-45);
                    bottom:100vh;}    
                
                }
        

    </style>
</head>

<body>
    <img  src="curriculo copy.jpeg" alt="">
    <span id="coracao">❤️</span>
    <span id="rocket">🚀</span>
</body>
</html>
