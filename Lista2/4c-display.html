<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 100vh;
            height: 100vh;
        }
         *{margin:0px; padding: 0px;box-sizing:border-box;}
         body{min-height:100vh}

         .box{border:1px solid black;
            box-sizing: border-box;
            display: inline-block; 
            width:25vw;
            height:25vh;
        }
        #box1{background-color: hotpink;
              position:fixed;
              top:50%;
              left:50%;
              transform: translate(-50%, -50%); }

        #box2{background-color: yellow;
             position:fixed;
              bottom:0px;
              left:0px;
             }
        #box3{position:fixed;
              bottom:0px;
              right:0px;
              font-size:50pt;
             transform :translate(rotate(45deg));
             animation: lancamento 10s ease-in 0s 1;}

        #box4{background-color: blue;
              position:fixed;
              top:0px;
             left:0px;
        }
        #box5{background-color: red;
          position:fixed;
              top:0px;
              right:0px;
              animation: rotacao 5s linear 0s infinite
              /*name duration timing-function deplay
                iteration-count direction fill-mode;  */}
            
                @keyframes lancamento{
                    0%{
                        bottom:0px;
                    }
                    100%{
                        bottom:700px;
                        left:1000px;
                    }
                }
              @keyframes rotacao{
                0%{}

                100%{transform:rotate(360deg);}
              }
    </style>
</head>
<body>
    <div id="box1" class="box">1</div>
    <div id="box2" class="box">2</div>
    <div id="box3" class="">🚀</div>
    <div id="box4" class="box">4</div>
    <div id="box5" class="box">5</div>
    
</body>
</html>
