<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

                
        .container{
            display:grid;
            
            grid-template-rows: 100px 200px 100px;
            grid-template-columns: 200px 100px 100px;
            grid-template-areas: "header header header"
                                 "main empty sidebar"
                                "footer footer footer";

        }
        @media (max-width:500px) {
            .container{
            display:grid;
            
            grid-template-rows: 100px 200px 100px;
            grid-template-columns: 1fr;
            grid-template-areas: "header "
                                 "main"
                                 "empty"
                                 " sidebar"
                                "footer";

            }
        }

        

        #box1{ grid-area: header;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: orange;
            border-radius: 5%;
              }

        #box2{ grid-area: main;
            display:flex;
            align-items: center;
            justify-content: center;
             background-color: lightblue;
             border-radius: 5%;}

        #box3{ grid-area: sidebar;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: red;
            border-radius: 5%;
        }

        #box4{ grid-area: empty;
            display:flex;
            align-items: center;
            justify-content: center;
             background-color: white;
             border-radius: 5%;
            }
             

        #box5{ grid-area: footer;
            display:flex;
            align-items: center;
            justify-content: center;
            background-color: green;
            border-radius: 5%;
       }

    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">Header</div>
        <div class="box" id="box2">Main</div>
        <div class="box" id="box3">Sidebar</div>
        <div class="box" id="box4">Empty</div>
        <div class="box" id="box5">Footer</div>
    </div>
</body>
</html>
