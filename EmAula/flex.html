<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      #box-div-4{
        position:relative; left:50px; top:-30px
      }

      .container{display:flex;
        height: 100vh;
        justify-content:space-around;/*controla a exibição no eixo flex*/
        flex-direction:row;
        align-items: center /*eixo perpendicular ao flex-direction*/}

        .box{
            background-color: rgb(100, 100, 100);
            border:1px solid orange;
            
        }
        .box:hover{ flex-grow: 3;
                    transition: all 3s}

            #box-div-1{ order:3 }
            #box-div-3{order:4}
            #box-div-5{order:5}
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box-div-1">1</div >
        <div  class="box" id="box-div-2">2</div >
        <div  class="box" id="box-3">3</div >
        <div  class="box" id="box-div-4">4</div >
        <div  class="box" id="box-5">5</div >
    </div>
    
     <div class="container">
        <span class="box" id="box-1">1</span>
        <span class="box" id="box-2">2</span>
        <span class="box" id="box-3">3</span>
        <span class="box" id="box-4">4</span>
        <span class="box" id="box-5">5</span>
    </div>
    
</body>
</html>
