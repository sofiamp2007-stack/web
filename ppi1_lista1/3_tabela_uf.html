<!DOCTYPE html>
<html>
    <head>
        <title>Tabela  Estados.</title>
        <style>
             table, td,th, caption{border:1px solid #000000} 
            </style>
    </head>
    <body>

        <h2>Estados do Brasil por Região</h2>

<table>
    <tr>
        <th>Índice</th>
        <th>Região</th>
        <th>Estado</th>
        <th>Sigla</th>
        <th>Capital</th>
    </tr>

    <!-- Região Sul -->
    <tr>
        <td>1</td>
        <td rowspan="3">Sul</td>
        <td><a href="https://pt.wikipedia.org/wiki/Paraná" target="_blank">Paraná</a></td>
        <td>PR</td>
        <td>Curitiba</td>
    </tr>
    <tr>
        <td>2</td>
        <td><a href="https://pt.wikipedia.org/wiki/Santa_Catarina" target="_blank">Santa Catarina</a></td>
        <td>SC</td>
        <td>Florianópolis</td>
    </tr>
    <tr>
        <td>3</td>
        <td><a href="https://pt.wikipedia.org/wiki/Rio_Grande_do_Sul" target="_blank">Rio Grande do Sul</a></td>
        <td>RS</td>
        <td>Porto Alegre</td>
    </tr>

    <!-- Região Sudeste -->
    <tr>
        <td>4</td>
        <td rowspan="4">Sudeste</td>
        <td><a href="https://pt.wikipedia.org/wiki/São_Paulo_(estado)" target="_blank">São Paulo</a></td>
        <td>SP</td>
        <td>São Paulo</td>
    </tr>
    <tr>
        <td>5</td>
        <td><a href="https://pt.wikipedia.org/wiki/Rio_de_Janeiro_(estado)" target="_blank">Rio de Janeiro</a></td>
        <td>RJ</td>
        <td>Rio de Janeiro</td>
    </tr>
    <tr>
        <td>6</td>
        <td><a href="https://pt.wikipedia.org/wiki/Minas_Gerais" target="_blank">Minas Gerais</a></td>
        <td>MG</td>
        <td>Belo Horizonte</td>
    </tr>
    <tr>
        <td>7</td>
        <td><a href="https://pt.wikipedia.org/wiki/Espírito_Santo_(estado)" target="_blank">Espírito Santo</a></td>
        <td>ES</td>
        <td>Vitória</td>
    </tr>

</table>
    </body>
</html>
