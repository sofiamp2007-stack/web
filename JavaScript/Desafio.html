<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 style="border: 1px solid black"> Text</h1>
    <div  tabindex="0" id="txt" style="border: 1px solid black;height: 50vh"> </div>
    <div id="status" style="border: 1px solid black;height: 10vh;"></div>
    <canvas id="canvas" height="1080px" width="1920px"></canvas>


    <script>
        var tecla;
        var mouse;
        let txt = document.querySelector("#txt")
        let status = document.querySelector("#status");
        var desenhando = false;

        txt.addEventListener('keypress', (keypress)=>{
                tecla =keypress;
                txt.innerHTML+=keypress.key;
              
          } )
          txt.addEventListener('keydown', (e) => {
            if(e.key==="Backspace"){
            txt.innerHTML.slice(0, -1);
            }
          })

          document.addEventListener('keydown', function (event){
            status.innerHTML = 'Evento keypress: ' +event.key;
          })

          // capturando posicao do mouse
          document.addEventListener('mousemove', (e) => {
            status.innerHTML='Posição do mouse: ' + e.clientX + ',' + e.
            clientY
          })

          //desenhando com o mouse no canva


          let ctx = canvas.getContext('2d');
          canvas.addEventListener('mousedown', (e) =>{
            desenhando=!desenhando
            ctx.moveTo(e.offsetX, e.offsetY);
          })

          canvas.addEventListener('mouseup', (e)=>{
            desenhando =!desenhando
          })

          document.addEventListener('mousemove', (e)=>{
            mouse =e
            if(desenhando){
            console.log("mouse"+ e.offsetX, ",", e.offsetY)
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            }
          })
          

    </script>
</body>
</html>
